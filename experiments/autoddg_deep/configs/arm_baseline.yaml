# Original AutoDDG @3c59e1c, called as in examples/quick_start.ipynb
# (sequential semantic mode, 100-row sample with random_state=9).
arm: baseline
pipeline: autoddg            # autoddg = original package, autoddg_deep = AutoDDGDeep
model: gpt-4o-mini           # locked across arms; quick_start default
description_words: 100
description_temperature: 0.0
topic_temperature: 0.0
sfd_temperature: null        # null = not passed (original); client default 0.0 applies
sample_size: 100
sample_random_state: 9
semantic_mode: sequential
topic_uses_original_description: true
read_max_rows: null
